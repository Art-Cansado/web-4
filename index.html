
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 04 - JavaScript</title>

    <style>
        .destaque {
            color: red;
            font-weight: bold;
        }

        .feito {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>
    <h1 id="titulo">Minha página</h1>

    <p class="texto">Aprendendo JavaScript.</p>
    <p class="texto">Praticando manipulação do DOM.</p>

    <h2>Lista de tarefas</h2>

    <ul id="lista">
        <li>Primeiro item</li>
        <li>Segundo item</li>
        <li>Terceiro item do HTML</li>
    </ul>

    <button id="botao" type="button">Clique aqui</button>

    <div>
        <label for="nome">Seu nome:</label>
        <input type="text" id="nome">
    </div>

    <form id="formulario">
        <label for="tarefa">Nova tarefa:</label>
        <input type="text" id="tarefa">
        <button type="submit">Adicionar tarefa</button>
    </form>

    <script src="app.js"></script>

</html>
